apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: monitoring-daemon
  # labels:
  #   app: myapp
  #   type: frontend
spec:
  template:
    metadata:
      # name: app: monitoring-agent
      labels:
        app: monitoring-agent
    spec:
      containers:
      - name: monitoring-agent
        image: monitoring-agent
  selector:
    matchLabels:
      app: monitoring-agent